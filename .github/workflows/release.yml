name: Release

# Every push to main: test, build every platform, and publish the next GitHub
# release with binaries, SHA256SUMS, and install.sh (with this repository
# filled in). Versions count v1.0, v1.1, ... v1.9, v2.0, v2.1, ...
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"] # docs-only changes don't cut a release
  workflow_dispatch:

permissions:
  contents: write # create the tag and release

# One release at a time, so two quick pushes can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi

      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Dashboard JavaScript syntax
        run: |
          for f in internal/web/static/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - run: shellcheck -s sh install.sh

      - name: Firewall web UI pages (PHP syntax, XML)
        run: |
          for f in gui/*.php gui/*/*.php gui/*/*.inc; do php -l "$f"; done
          for f in gui/*/*.xml; do php -r '$x = new DOMDocument(); exit($x->load($argv[1]) ? 0 : 1);' "$f"; done

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the existing tags to pick the next version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Next version
        id: version
        run: |
          set -eu
          last=$(git tag --list 'v[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]$' | sort -V | tail -n1 || true)
          if [ -z "$last" ]; then
            next=v1.0
          else
            major=${last#v}; major=${major%.*}
            minor=${last##*.}
            if [ "$minor" -ge 9 ]; then next="v$((major + 1)).0"
            else next="v$major.$((minor + 1))"; fi
          fi
          echo "last=${last:-none} next=$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          CGO_ENABLED: "0"
          GOARM: "7"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          mkdir -p release
          for target in freebsd/amd64 freebsd/arm64 freebsd/arm linux/amd64 linux/arm64 linux/arm darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            dir="build/${os}_${arch}"; mkdir -p "$dir"
            ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$dir/traffic-monitor$ext" .
            cp README.md traffic-monitor.example.yaml "$dir/"
            if [ "$os" = freebsd ]; then cp -R gui "$dir/"; fi # pfSense/OPNsense web UI pages
            name="traffic-monitor_${os}_${arch}"
            if [ "$os" = windows ]; then (cd "$dir" && zip -q "../../release/$name.zip" ./*)
            else tar -czf "release/$name.tar.gz" -C "$dir" .; fi
          done

      - name: Installer with this repository filled in
        run: sed "s#OWNER/traffic-monitor#${GITHUB_REPOSITORY}#g" install.sh > release/install.sh

      - name: Checksums
        run: cd release && sha256sum ./* | sed 's#\./##' > SHA256SUMS && cat SHA256SUMS

      - name: Smoke test the Linux build
        run: |
          tar -xzf release/traffic-monitor_linux_amd64.tar.gz -C /tmp ./traffic-monitor
          /tmp/traffic-monitor version | grep -q "${{ steps.version.outputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          make_latest: true
